name: ginga_app
description: Ginga App - Comunidad & Entrenamiento de Capoeira
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  go_router: ^14.0.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.1
  firebase_storage: ^12.3.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  firebase_messaging: ^15.1.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  video_player: ^2.11.1
  flutter_tts: ^4.2.5
  just_audio: ^0.9.42


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo_ginga.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/logo_ginga_padded.png"
  android: true
  ios: true
  android_12:
    image: "assets/images/logo_ginga_padded.png"
    color: "#FFFFFF"