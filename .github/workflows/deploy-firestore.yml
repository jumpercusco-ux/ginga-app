name: Deploy Firestore - Reglas e Índices (Manual y Selectivo)

on:
  workflow_dispatch:
    inputs:
      component:
        description: 'Componente de Firestore a desplegar'
        required: true
        type: choice
        default: 'rules'
        options:
          - rules
          - indexes
          - 'rules,indexes'
      target_project:
        description: 'Proyecto Firebase de destino'
        required: true
        default: 'capoeirafiu-ea8ljo'
      confirmation:
        description: 'Escribe "CONFIRMAR_DEPLOY_FIRESTORE" para autorizar'
        required: true
        default: ''

jobs:
  deploy-firestore:
    name: Despliegue Manual Firestore
    runs-on: ubuntu-latest
    steps:
      - name: Validar confirmación de seguridad
        run: |
          if [ "${{ inputs.confirmation }}" != "CONFIRMAR_DEPLOY_FIRESTORE" ]; then
            echo "ERROR: Despliegue denegado. Se requiere confirmation='CONFIRMAR_DEPLOY_FIRESTORE'."
            exit 1
          fi
          echo "Despliegue manual autorizado para Firestore: ${{ inputs.component }}"
          echo "Proyecto destino: ${{ inputs.target_project }}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.10.1

      - name: Validar reglas con Firestore Emulator antes de desplegar
        if: ${{ contains(inputs.component, 'rules') }}
        run: |
          firebase emulators:exec --only firestore 'node real_agent_harness/test_firestore_rules.js'

      - name: Deploy Firestore selectivo
        run: |
          firebase deploy \
            --only firestore:${{ inputs.component }} \
            --project ${{ inputs.target_project }} \
            --non-interactive \
            --token "${{ secrets.FIREBASE_TOKEN }}"
